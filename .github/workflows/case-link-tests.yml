name: Case link correction checks
on:
  push:
    branches:
      - feature/case-id-display-correction-20261016
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - run: python -m unittest discover -s tests -p 'test_case_link_display.py' -v
